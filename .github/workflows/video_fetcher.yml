name: video_fetcher

on:
  push:
    paths:
      - 'sources.txt'
      - 'video_fetcher.py'
      - '.github/workflows/video_fetcher.yml'
  workflow_dispatch:
  schedule:
    # 北京时间每天早上 8:00 运行 (UTC 0:00)
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 运行抓取与转换脚本
        run: |
          python video_fetcher.py

      - name: 自动提交并推送生成的 M3U 文件
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist.m3u via video_fetcher [skip ci]" && git push)
